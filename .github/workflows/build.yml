name: Build Orion

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reassemble archive
        run: |
          cat orion-part-* > orion-optimized.zip
          mkdir -p project
          unzip -o orion-optimized.zip -d project

      - name: Find project folder
        run: |
          find project -type f -name package.json -not -path '*/node_modules/*'

      - name: Install dependencies
        run: |
          PACKAGE_FILE="$(find project -type f -name package.json -not -path '*/node_modules/*' | head -n 1)"
          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            find project -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          cd "$(dirname "$PACKAGE_FILE")"
          npm cache clean --force
          npm install --no-audit --no-fund --legacy-peer-deps
