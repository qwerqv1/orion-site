
name: Build Orion

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble archive
        run: |
          cat orion-part-00 orion-part-01 > orion-optimized.zip
          unzip -t orion-optimized.zip
          unzip -o orion-optimized.zip -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use stable npm
        run: |
          npm install --global npm@10.9.4
          npm --version
          node --version

      - name: Install dependencies
        working-directory: project/app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build site
        working-directory: project/app
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: orion-dist
          path: project/app/dist/
