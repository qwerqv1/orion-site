
name: Build Orion

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reassemble archive
        run: |
          cat orion-part-* > orion-optimized.zip
          mkdir -p project
          unzip -o orion-optimized.zip -d project

      - name: Show project files
        run: |
          echo "Project files:"
          find project -maxdepth 5 -type f \( -name "package.json" -o -name "vite.config.*" -o -name "index.html" \)
          echo "Other files:"
          find project -maxdepth 3 -type f | head -n 80
