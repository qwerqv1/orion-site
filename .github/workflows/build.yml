name: Build Orion

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reassemble archive
        run: |
          cat orion-part-* > orion-optimized.zip
          unzip -o orion-optimized.zip -d project

      - name: Find project folder
        run: |
          find project -name package.json -print

      - name: Install dependencies
        run: |
          cd project
          npm cache clean --force
          npm install --no-audit --no-fund --legacy-peer-deps
