
      - name: Install TypeScript
        working-directory: project/app
        run: npm install --no-save --no-audit --no-fund typescript

name: Build Orion

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reassemble archive
        run: |
          cat orion-part-* > orion-optimized.zip
          mkdir -p project
          unzip -o orion-optimized.zip -d project

      - name: Install dependencies
        working-directory: project/app
        run: npm ci --no-audit --no-fund

      - name: Build Orion
        working-directory: project/app
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/app/dist

      - name: Deploy website
        uses: actions/deploy-pages@v4
